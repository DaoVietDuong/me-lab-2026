# Internal PKI: a self-signed root CA, created inside the cluster (its key never leaves it, never in Git),
# and a "lab-ca" issuer that signs every certificate in the lab.
# Name constraints: the CA can only sign *.lab names and 10.10.0.0/24 addresses, so trusting it
# on Windows can't be abused for any other site.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: me-lab-2026 root CA
  secretName: lab-root-ca
  duration: 87600h        # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        - lab
      ipRanges:
        - 10.10.0.0/24
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-root-ca
