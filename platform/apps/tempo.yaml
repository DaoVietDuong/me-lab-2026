# Traces: Tempo as one process on local disk. The chart moved to grafana-community
# (the grafana/helm-charts copy is deprecated).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: tempo
    targetRevision: 3.2.0
    helm:
      valuesObject:
        tempo:
          retention: 24h
          reportingEnabled: false
          # OTLP only; traces arrive from Alloy
          receivers:
            jaeger: null
            otlp:
              protocols:
                grpc: {endpoint: "0.0.0.0:4317"}
                http: {endpoint: "0.0.0.0:4318"}
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {memory: 512Mi}
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
