# One Argo CD app per service, pointing at deploy/<service>; CI only ever changes the image tag there
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DaoVietDuong/me-lab-2026.git
    targetRevision: main
    path: deploy/hello
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
