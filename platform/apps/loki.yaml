# Logs: Loki as one process with filesystem storage. The chart's default is a scalable setup with
# memcached caches that alone want several GB; none of that is needed at lab scale.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      valuesObject:
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2026-01-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: {prefix: loki_index_, period: 24h}
          limits_config:
            retention_period: 72h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem
          pattern_ingester:
            enabled: false
          analytics:
            reporting_enabled: false
        singleBinary:
          replicas: 1
          persistence:
            storageClass: local-path
            size: 3Gi
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 768Mi}
        # Off: scalable targets, caches, gateway, canary, self-test, bundled MinIO
        read: {replicas: 0}
        write: {replicas: 0}
        backend: {replicas: 0}
        chunksCache: {enabled: false}
        resultsCache: {enabled: false}
        gateway: {enabled: false}
        lokiCanary: {enabled: false}
        test: {enabled: false}
        minio: {enabled: false}
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
