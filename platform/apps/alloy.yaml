# Alloy (one pod per node): the single collector for the lab.
#  - pod logs from this node's /var/log/pods  -> Loki
#  - hub firewall/syslog over TCP 1514          -> Loki   (LB IP 10.10.0.201, platform/observability)
#  - OTLP traces from services (4317 gRPC, 4318 HTTP) -> Tempo
# Alloy is an OpenTelemetry Collector distribution, so it also stands in for the plan's OTel Collector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.14.0
    helm:
      valuesObject:
        controller:
          type: daemonset
        alloy:
          enableReporting: false
          mounts:
            varlog: true
          extraPorts:
            - {name: syslog, port: 1514, targetPort: 1514, protocol: TCP}
            - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
            - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          configMap:
            content: |
              // ---------- Pod logs (this node only; HOSTNAME = node name, set by the chart) ----------
              discovery.kubernetes "pods" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + sys.env("HOSTNAME")
                }
              }

              discovery.relabel "pods" {
                targets = discovery.kubernetes.pods.targets
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
                  separator     = ";"
                  regex         = "^;*([^;]+)(;.*)?$"
                  target_label  = "app"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              local.file_match "pods" {
                path_targets = discovery.relabel.pods.output
              }

              loki.source.file "pods" {
                targets    = local.file_match.pods.targets
                forward_to = [loki.process.pods.receiver]
              }

              loki.process "pods" {
                stage.cri {}
                forward_to = [loki.write.default.receiver]
              }

              // ---------- Hub syslog (firewall drops) ----------
              loki.source.syslog "hub" {
                listener {
                  address  = "0.0.0.0:1514"
                  protocol = "tcp"
                  labels   = { job = "hub-syslog" }
                }
                relabel_rules = loki.relabel.syslog.rules
                forward_to    = [loki.write.default.receiver]
              }

              loki.relabel "syslog" {
                forward_to = []
                rule {
                  source_labels = ["__syslog_message_hostname"]
                  target_label  = "host"
                }
                rule {
                  source_labels = ["__syslog_message_app_name"]
                  target_label  = "app"
                }
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.observability.svc:3100/loki/api/v1/push"
                }
              }

              // ---------- Traces: OTLP in, Tempo out ----------
              otelcol.receiver.otlp "default" {
                grpc { endpoint = "0.0.0.0:4317" }
                http { endpoint = "0.0.0.0:4318" }
                output { traces = [otelcol.processor.batch.default.input] }
              }

              otelcol.processor.batch "default" {
                output { traces = [otelcol.exporter.otlp.tempo.input] }
              }

              otelcol.exporter.otlp "tempo" {
                client {
                  endpoint = "tempo.observability.svc:4317"
                  tls { insecure = true }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
