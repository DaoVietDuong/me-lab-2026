# Lab databases (platform/databases). Retries until the operators' CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DaoVietDuong/me-lab-2026.git
    targetRevision: main
    path: platform/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
