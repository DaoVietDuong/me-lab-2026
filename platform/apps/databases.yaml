# Lab databases (platform/databases). Retries until the operators' CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: databases
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DaoVietDuong/me-lab-2026.git
    targetRevision: main
    path: platform/databases
  destination:
    server: https://kubernetes.default.svc
    namespace: db
  # M4-02 switches pg-lab between async and sync replication with kubectl, mid-experiment.
  # Argo CD ignores only that field; everything else in pg-lab stays Git-controlled.
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      name: pg-lab
      jsonPointers:
        - /spec/postgresql/synchronous
        # M4-03: delayed apply on the replicas (receive WAL at once, apply it later)
        - /spec/postgresql/parameters/recovery_min_apply_delay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true   # don't overwrite the ignored field on sync either
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
