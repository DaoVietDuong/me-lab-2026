# Smoke test behind the gateway. whoami echoes the pod name and the request,
# so you can see which replica answered and which client IP reached it.
apiVersion: v1
kind: Namespace
metadata:
  name: hello
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: hello
spec:
  replicas: 2
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      containers:
        - name: whoami
          image: docker.io/traefik/whoami:v1.11.0
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: hello
spec:
  selector: {app: whoami}
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: hello
spec:
  parentRefs:
    - name: lab-gateway
      namespace: gateway
  rules:
    - backendRefs:
        - name: whoami
          port: 80
