# Hubble UI (installed with Cilium) at https://hubble.apps.lab: live flow map for Module 1
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - name: lab-gateway
      namespace: gateway
  hostnames:
    - hubble.apps.lab
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
