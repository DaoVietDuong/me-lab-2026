apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
spec:
  replicas: 2
  selector:
    matchLabels: {app: hello}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}   # never fewer than 2 ready pods during a rollout
  template:
    metadata:
      labels: {app: hello}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hello
          image: ghcr.io/daovietduong/hello   # tag comes from kustomization.yaml
          env:
            # Fully qualified with a trailing dot: one DNS query instead of walking the ndots:5 search list.
            # Under 100 ms delay + 5% loss, the short name took 0.5-3 s to resolve (M1-05).
            - name: DOWNSTREAM
              value: http://hello.demo.svc.cluster.local.
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
