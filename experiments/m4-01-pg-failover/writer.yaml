# Writer for M4 experiments: streams INSERTs to the primary (pg-lab-rw) over one connection.
# Every row psql prints is an ACKNOWLEDGED (committed) write: "<id>|<server time>".
# On error it reconnects and continues with a new id range (attempt * 10^7 + n), logging the gap.
# Connection string from the CloudNativePG-generated secret pg-lab-app (never printed).
apiVersion: v1
kind: Pod
metadata:
  name: pg-writer
  namespace: db
  labels: {app: pg-writer}
spec:
  restartPolicy: Never
  # Never on the primary's node: the writer must survive the fault it observes
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {cnpg.io/cluster: pg-lab, role: primary}
          topologyKey: kubernetes.io/hostname
  containers:
    - name: writer
      image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
      env:
        - name: PGURI
          valueFrom: {secretKeyRef: {name: pg-lab-app, key: uri}}
        - {name: PGCONNECT_TIMEOUT, value: "2"}
        - {name: RATE_SLEEP, value: "0.002"}   # pause between inserts (s): ~200-400 writes/s
      command: [bash, -c]
      args:
        - |
          # Dead-peer detection. A powered-off server sends no RST: without these the client hung
          # forever in M4-01. tcp_user_timeout: give up when sent data is unacknowledged for 5 s.
          PGURI="$PGURI?keepalives=1&keepalives_idle=3&keepalives_interval=1&keepalives_count=3&tcp_user_timeout=5000"
          psql "$PGURI" -qtAX -c "create table if not exists writes (id bigint primary key, at timestamptz not null default clock_timestamp())"
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            echo "# connect attempt=$attempt at $(date -u +%T.%N | cut -c1-12)"
            # One connection; psql only prints a row after its INSERT committed (autocommit).
            # stdbuf -oL: psql buffers stdout into a pipe, which would hide acks still in the buffer when it dies
            ( n=0; while true; do n=$((n + 1))
                echo "insert into writes (id) values ($((attempt * 10000000 + n))) returning id, to_char(clock_timestamp(), 'HH24:MI:SS.MS');"
                sleep "$RATE_SLEEP"; done ) |
              stdbuf -oL psql "$PGURI" -qtAX -v ON_ERROR_STOP=1 2>&1 | sed -u 's/^psql:/# error:/'
            echo "# disconnected attempt=$attempt at $(date -u +%T.%N | cut -c1-12)"
            sleep 0.2
          done
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {memory: 128Mi}
