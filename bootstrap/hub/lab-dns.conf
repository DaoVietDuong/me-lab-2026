# Every *.apps.lab name points at lab-gateway; the HTTPRoute hostnames pick the service
address=/apps.lab/10.10.0.200

# TTLs (M1-04): dnsmasq answers its own names with TTL 0 by default, and the Hyper-V Default Switch's
# DNS proxy returns TTL 0 for everything upstream. With TTL 0 no client caches anything, so every
# request paid a DNS round trip across the hub, and a lost UDP query stalled the request for 5 s.
local-ttl=60
min-cache-ttl=60
