#!/usr/sbin/nft -f
# Hub firewall: default deny, every drop logged (journalctl -k -g fw-drop).
# Implements the "Hub firewall policy" table in the practice plan.
# Apply with: sudo lab-fw apply     Switch tester->lab mode with: sudo lab-fw normal|pentest

flush ruleset

define WAN  = "eth0"     # Default Switch (internet)
define MGMT = "eth1"     # lab-mgmt (Windows)
define LAB  = "eth2"     # spoke-lab
define TEST = "eth3"     # spoke-test

define MGMT_NET    = 10.0.0.0/24
define LAB_NET     = 10.10.0.0/24
define TEST_NET    = 10.20.0.0/24
define INGRESS_VIP = 10.10.0.200

table inet lab_fw {
    # Filled by dnsmasq (nftset=, see /etc/dnsmasq.d/egress.conf) with the IPs of allowlisted domains.
    # Timeout is longer than dnsmasq's max-cache-ttl, so an IP never expires while a client may still use it.
    set egress_https4 { type ipv4_addr; flags timeout; timeout 24h; }
    set egress_http4  { type ipv4_addr; flags timeout; timeout 24h; }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iif lo accept
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept

        iifname $MGMT ip saddr $MGMT_NET tcp dport 22 accept comment "admin SSH from Windows"
        iifname { $MGMT, $LAB, $TEST } udp dport 53 accept comment "dnsmasq"
        iifname { $MGMT, $LAB, $TEST } tcp dport 53 accept comment "dnsmasq"
        iifname { $LAB, $TEST } udp dport 123 accept comment "chrony: hub is the spokes' time source"
        iifname $WAN udp sport 67 udp dport 68 accept comment "DHCP from Default Switch"

        limit rate 10/second burst 20 packets log prefix "fw-drop in: " level info
        counter
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        # PMTU discovery must keep working (Module 1 MTU experiment)
        ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept

        # Windows (lab-mgmt) -> spokes: administration
        iifname $MGMT ip saddr $MGMT_NET oifname { $LAB, $TEST } tcp dport { 22, 443, 6443 } accept comment "admin"
        iifname $MGMT ip saddr $MGMT_NET oifname { $LAB, $TEST } icmp type echo-request accept comment "admin ping"

        # tester -> lab: black-box (443 to the ingress VIP) or pentest (everything); see lab-fw
        iifname $TEST ip saddr $TEST_NET oifname $LAB jump tester_to_lab

        # lab -> internet: only allowlisted domains (DNS goes to the hub, never direct)
        iifname $LAB ip saddr $LAB_NET oifname $WAN tcp dport 443 ip daddr @egress_https4 counter accept comment "lab egress https"
        iifname $LAB ip saddr $LAB_NET oifname $WAN tcp dport 80  ip daddr @egress_http4  counter accept comment "lab egress apt"

        # tester -> internet: tool updates
        iifname $TEST ip saddr $TEST_NET oifname $WAN tcp dport { 80, 443 } accept comment "tester egress"

        # lab -> tester: nothing (falls through to the drop)
        limit rate 10/second burst 20 packets log prefix "fw-drop fwd: " level info
        counter
    }

    chain tester_to_lab {
        include "/etc/lab/fw-mode.nft"
    }
}

table inet lab_nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr { $LAB_NET, $TEST_NET } masquerade
    }
}
