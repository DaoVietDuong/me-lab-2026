# Ship the hub firewall's drop log to Loki: Alloy listens on the LB address 10.10.0.201:1514.
# RFC 5424 over TCP with octet-counted framing; queued in memory (and retried forever) while the cluster is down.
:msg, contains, "fw-drop" action(
    type="omfwd" target="10.10.0.201" port="1514" protocol="tcp"
    TCP_Framing="octet-counted" template="RSYSLOG_SyslogProtocol23Format"
    queue.type="LinkedList" queue.size="10000" action.resumeRetryCount="-1")
