# Lab-spoke egress allowlist. dnsmasq adds every IPv4 it resolves for these domains
# (and all their subdomains) to the hub firewall's sets. Anything else is dropped and logged.
# To allow a new domain: add it here, then  sudo lab-fw apply
# Find what was blocked:  journalctl -k -g 'fw-drop fwd' --since -10min

# Keep IPs in the set for longer than any cached answer (set timeout is 24h)
max-cache-ttl=3600

# Git and Argo CD
nftset=/github.com/githubusercontent.com/github.io/4#inet#lab_fw#egress_https4
# Container registries
nftset=/ghcr.io/docker.io/docker.com/quay.io/registry.k8s.io/pkg.dev/4#inet#lab_fw#egress_https4
# k3s install and releases
nftset=/k3s.io/4#inet#lab_fw#egress_https4
# Not allowed on purpose: grafana.com + storage.googleapis.com (Grafana plugin downloads). Allowing GCS
# would open egress to every bucket on it; Grafana's plugin pre-install is disabled instead (M1-03).
# Helm charts outside github.io
nftset=/jetstack.io/cilium.io/chaos-mesh.org/k8ssandra.io/strimzi.io/4#inet#lab_fw#egress_https4
# CloudNativePG's chart repo (cloudnative-pg.github.io redirects here)
nftset=/cloudnative-pg.io/4#inet#lab_fw#egress_https4
# Ubuntu packages (apt uses plain HTTP by default)
nftset=/ubuntu.com/4#inet#lab_fw#egress_http4,4#inet#lab_fw#egress_https4
